<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparansi APBDes — Bandungsari</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .grid-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .filter-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); padding: 0.5rem 1rem; border-radius: 8px; color: #fff; cursor: pointer; transition: 0.3s; position: relative; font-size: 0.85rem; }
        .filter-btn.active { background: var(--accent); }
        .filter-btn::after {
            content: '';
            position: absolute; top: 6px; right: 6px; width: 6px; height: 6px;
            border-radius: 50%; background: #ff3b30; /* Default: red (empty) */
        }
        .filter-btn.has-data::after { background: #32d74b; /* Green (data ready) */ }
        
        @media (max-width: 768px) {
            .grid-wrapper { grid-template-columns: 1fr; }
            #filter-container { justify-content: center; }
            .filter-btn { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="u-container site-header__container">
            <a href="index.html" class="site-logo" style="font-size: 1.4rem;">Bandungsari.com</a>
            <button class="menu-toggle" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <nav class="site-nav">
                <a href="profil.html" class="nav-link">Profil</a>
                <a href="religi.html" class="nav-link">Religi</a>
                <a href="potensi.html" class="nav-link">Potensi</a>
                <a href="wawasan.html" class="nav-link">Wawasan</a>
                <a href="kontak.html" class="nav-link">Kontak</a>
                <a href="apbdes.html" class="nav-cta">APBDes 2026</a>
            </nav>
            <div class="mobile-menu">
                <a href="profil.html">Profil</a>
                <a href="religi.html">Religi</a>
                <a href="potensi.html">Potensi</a>
                <a href="wawasan.html">Wawasan</a>
                <a href="kontak.html">Kontak</a>
                <a href="apbdes.html">APBDes 2026</a>
            </div>
        </div>
    </header>

    <main class="u-container">
        <section class="hero">
            <div class="hero__badge">Pusat Data Anggaran</div>
            <h1 class="hero__title">APBDes Transparan</h1>
            <p class="hero__lead">Arsip digital APBDes Desa Bandungsari (2014-2027). Dot hijau menandakan data tersedia.</p>
            <div style="margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem;" id="filter-container">
                <button class="filter-btn active" data-year="all">Semua</button>
            </div>
        </section>

        <div class="grid-wrapper" id="grid">
            <!-- Cards generated via JS -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Hamburger Menu Logic
            const toggle = document.querySelector('.menu-toggle');
            const menu = document.querySelector('.mobile-menu');
            toggle.addEventListener('click', () => {
                menu.classList.toggle('is-active');
            });

            const years = Array.from({length: 14}, (_, i) => 2014 + i);
            const dataReady = [2025]; // 2023 sudah dihapus karena data Banjarejo
            const filterContainer = document.getElementById('filter-container');
            const grid = document.getElementById('grid');

            // Setup Filters
            years.forEach(year => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.innerText = year;
                btn.setAttribute('data-year', year);
                if(dataReady.includes(year)) btn.classList.add('has-data');
                filterContainer.appendChild(btn);
            });

            // Setup Cards
            years.forEach(year => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.setAttribute('data-year', year);
                
                let content = `<h3>APBDes ${year}</h3>`;
                if (year === 2025) {
                    content += `
                        <p style="color:var(--text-muted); font-size: 0.85rem;">Kode: 3315092007</p>
                        <div style="margin: 1rem 0; font-size: 0.9rem;">
                            <p>Alokasi Dasar: Rp 741.136.000</p>
                            <p>Alokasi Formula: Rp 910.941.000</p>
                            <hr style="border:0; border-top:1px solid var(--border-glass); margin:0.5rem 0;">
                            <p style="font-weight:700;">Total: Rp 1.652.077.000</p>
                        </div>
                        <a href="https://djpk.kemenkeu.go.id/wp-content/uploads/2024/10/Provinsi-Jawa-Tengah.pdf" class="nav-cta" target="_blank">Lihat PDF Resmi</a>`;
                } else {
                    content += `<p style="margin: 1rem 0;">Laporan realisasi anggaran tahun ${year} belum diarsipkan secara digital. Segera tersedia.</p>`;
                }
                card.innerHTML = content;
                grid.appendChild(card);
            });

            // Filter Logic
            filterContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    const year = e.target.getAttribute('data-year');
                    document.querySelectorAll('.glass-card').forEach(card => {
                        card.style.display = (year === 'all' || card.getAttribute('data-year') === year) ? 'block' : 'none';
                    });
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
